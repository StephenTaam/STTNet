name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: release
            type: Release
            sanitizers: OFF
          - name: sanitizers
            type: Debug
            sanitizers: ON
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build doxygen libjsoncpp-dev libssl-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build.type }}
          -DSTTNET_BUILD_DOCS=ON
          -DSTTNET_ENABLE_SANITIZERS=${{ matrix.build.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate Doxygen
        if: matrix.build.name == 'release'
        run: cmake --build build --target sttnet_docs
      - name: Validate installed CMake and pkg-config packages
        if: matrix.build.name == 'release'
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/sttnet-install"
          cmake -S tests/package_consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sttnet-install"
          cmake --build build-consumer
          ./build-consumer/sttnet_package_consumer
          export PKG_CONFIG_PATH="$RUNNER_TEMP/sttnet-install/lib/pkgconfig"
          pkg-config --exists sttnet
          c++ -std=c++17 examples/http_hello.cpp $(pkg-config --cflags --libs sttnet) \
            -o build-consumer/sttnet_pkgconfig_consumer
          cmake -S tests/subdirectory_consumer -B build-subdirectory-consumer -G Ninja
          cmake --build build-subdirectory-consumer
          ./build-subdirectory-consumer/sttnet_subdirectory_consumer
      - name: HTTP smoke test
        if: matrix.build.name == 'release'
        run: bash tests/graceful_shutdown.sh ./build/sttnet_example
